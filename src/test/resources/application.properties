# Test Configuration - Inherits main application PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_cab_pooling
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable automatic demo data seeding during unit and integration test runs
app.seed.enabled=false

# Allow admin self-registration in tests so fixtures can create ROLE_ADMIN users
app.security.allow-admin-self-registration=true

# Keep routing constraints consistent with production defaults
app.routing.max-ride-minutes=90
app.routing.max-cluster-radius-km=15.0
app.routing.max-detour-km=30.0
app.routing.geohash-precision=5
