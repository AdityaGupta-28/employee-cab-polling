# Application Configuration
spring.application.name=employee_cab_pooling
server.port=8080

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_cab_pooling
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Security — never allow public ROLE_ADMIN self-registration in production
app.security.allow-admin-self-registration=false

# Routing / VRP constraints (case study hard rules)
app.routing.max-ride-minutes=90
app.routing.max-cluster-radius-km=8.0
app.routing.max-detour-km=30.0
app.routing.geohash-precision=5
app.routing.night-safety.start=20:00
app.routing.night-safety.end=06:00

# OSRM road-distance provider (falls back to Haversine when disabled/unreachable)
app.routing.osrm.enabled=false
app.routing.osrm.url=http://router.project-osrm.org

